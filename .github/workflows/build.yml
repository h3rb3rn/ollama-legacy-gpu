name: Build, validate and deploy Ollama GPU releases

on:
  push:
    branches: [main]
    paths:
      - 'dockerfiles/**'
      - 'presets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'patches/bonsai/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      ollama_version:
        description: 'Published Ollama release tag, or latest'
        required: false
        default: latest
  repository_dispatch:
    types: [new-ollama-release]

permissions:
  contents: read

# Never cancel a deployment halfway through replacement/rollback.
concurrency:
  group: ollama-gpu-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ollama-legacy

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      short: ${{ steps.resolve.outputs.short }}
      builds: ${{ steps.matrix.outputs.builds }}
      hardware: ${{ steps.matrix.outputs.hardware }}
      hardware_configured: ${{ steps.matrix.outputs.hardware_configured }}
    steps:
      - uses: actions/checkout@v4
      - name: Run release guard regressions
        run: python3 -m unittest discover -s tests -v
      - name: Resolve a published upstream release
        id: resolve
        env:
          REQUESTED: ${{ inputs.ollama_version || github.event.client_payload.version || 'latest' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = latest ]; then
            VERSION=$(gh api repos/ollama/ollama/releases/latest --jq .tag_name)
          else
            [[ "$REQUESTED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
            VERSION=$(gh api "repos/ollama/ollama/releases/tags/$REQUESTED" --jq .tag_name)
          fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Resolve build matrix and configured hardware gates
        id: matrix
        env:
          OLLAMA_GPU_TEST_TARGETS: ${{ vars.OLLAMA_GPU_TEST_TARGETS }}
        run: |
          set -euo pipefail
          BUILDS=$(python3 scripts/release-matrix.py)
          echo "builds=$BUILDS" >> "$GITHUB_OUTPUT"
          if [ -z "$OLLAMA_GPU_TEST_TARGETS" ]; then
            echo 'hardware={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'hardware_configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No GPU runner inventory configured. Build candidates only; promotion, deployment and version recording remain disabled.'
            exit 0
          fi
          HARDWARE=$(python3 scripts/release-inventory.py)
          echo "hardware=$HARDWARE" >> "$GITHUB_OUTPUT"
          echo 'hardware_configured=true' >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.variant }} / Ollama ${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable Bonsai candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            OLLAMA_VERSION=${{ needs.prepare.outputs.version }}
            BONSAI=ON
            CUDA_ARCHITECTURES=${{ matrix.architectures }}
            GGML_CUDA_FA=${{ matrix.flash_attention }}
            JOBS=4
          tags: ${{ env.IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.variant }}
          cache-from: type=gha,scope=bonsai-${{ matrix.variant }}-v2
          cache-to: type=gha,scope=bonsai-${{ matrix.variant }}-v2,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.description=Ollama with pinned Prism Bonsai runtime; ${{ matrix.description }}
      - name: Record exact candidate digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          mkdir -p digests
          echo "$IMAGE@$DIGEST" > "digests/$VARIANT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}
          path: digests/*.txt
          if-no-files-found: error

  hardware:
    needs: [prepare, build]
    if: needs.prepare.outputs.hardware_configured == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.hardware) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.variant }}
          path: digests
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test Bonsai and ordinary GGUF on the configured GPU pool
        env:
          CONFIG: ${{ matrix.config }}
          VARIANT: ${{ matrix.variant }}
          TARGET: ${{ matrix.id }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.short }}
        run: |
          set -euo pipefail
          python3 scripts/test-release-gpu.py --config "$CONFIG" \
            --image "$(cat "digests/$VARIANT.txt")" --output "evidence/$TARGET"
          python3 -c 'import json,os; from pathlib import Path; r=json.loads((Path("evidence")/os.environ["TARGET"]/"result.json").read_text()); assert r["version"]["version"] == os.environ["EXPECTED_VERSION"]; assert r["target"] == os.environ["TARGET"]; assert r["variant"] == os.environ["VARIANT"]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.id }}
          path: evidence/${{ matrix.id }}/
          if-no-files-found: error

  deploy:
    needs: [prepare, hardware]
    if: needs.hardware.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.hardware) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: matrix.deploy
        with:
          name: evidence-${{ matrix.id }}
          path: evidence
      - uses: docker/login-action@v3
        if: matrix.deploy
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace only the configured production target, with rollback
        if: matrix.deploy
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          python3 scripts/deploy-tested-release.py --config "$CONFIG" \
            --evidence evidence/result.json --output deployment/result.json
      - uses: actions/upload-artifact@v4
        if: always() && matrix.deploy
        with:
          name: deployment-${{ matrix.id }}
          path: deployment/
          if-no-files-found: error

  promote:
    needs: [prepare, hardware, deploy]
    if: needs.hardware.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.builds) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.variant }}
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the tested digest after successful rollout
        env:
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ needs.prepare.outputs.short }}
        run: |
          set -euo pipefail
          REF=$(cat "digests/$VARIANT.txt")
          docker buildx imagetools create \
            --tag "$IMAGE:$VARIANT-$VERSION" --tag "$IMAGE:$VARIANT-latest" \
            --tag "$IMAGE:bonsai-$VARIANT-v$VERSION" --tag "$IMAGE:bonsai-$VARIANT-latest" "$REF"

  record-version:
    needs: [prepare, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Record only the fully validated and deployed version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$(cat .last-built-version 2>/dev/null || true)" = "$VERSION" ]; then exit 0; fi
          echo "$VERSION" > .last-built-version
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .last-built-version
          git commit -m "chore: validated and deployed Ollama $VERSION"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin "$(git branch --show-current)"
          done
          exit 1
