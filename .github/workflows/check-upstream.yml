name: Upstream Ollama Release Check

on:
  schedule:
    # Every Monday at 06:17 UTC (off-peak, avoids :00/:30 congestion)
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      # write is required by createDispatchEvent below, not for committing —
      # the version file is recorded by the build workflow.
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Ollama version
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(gh api repos/ollama/ollama/releases/latest --jq .tag_name)
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Upstream: $VERSION"

      - name: Read last built version
        id: local
        run: |
          LAST=$(cat .last-built-version 2>/dev/null || echo "none")
          echo "last=$LAST" >> $GITHUB_OUTPUT
          echo "Last built: $LAST"

      - name: New version detected — trigger build
        if: steps.upstream.outputs.version != steps.local.outputs.last
        uses: actions/github-script@v7
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              event_type: 'new-ollama-release',
              client_payload: {
                version: process.env.UPSTREAM_VERSION
              }
            });
            console.log('Build workflow triggered for ' + process.env.UPSTREAM_VERSION);

      # NOTE: .last-built-version is written by the build workflow's
      # record-version job, after all builds, hardware tests and rollouts. Recording
      # it here would mark a version as done before the build even finished, so
      # a failed build would never be retried.

      - name: Already up to date
        if: steps.upstream.outputs.version == steps.local.outputs.last
        run: echo "Already current (${{ steps.upstream.outputs.version }}) — no build needed."
