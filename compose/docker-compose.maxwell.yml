# Deployment for Tesla M10 (CC 5.0, Maxwell) — CUDA 12, gepoolte 4-GPU-Instanz
# Usage: docker compose -f compose/docker-compose.maxwell.yml up -d
#
# Topologie-Historie: Die Optimierungskampagne (siehe
# PERFORMANCE-OPTIMIZATION-LOG.md) hatte diesen Host am 2026-09-16 zwischen-
# zeitlich auf 4 unabhängige Single-GPU-Instanzen umgestellt, weil Phase 2
# Flash Attention für Multi-GPU-Pools als nicht validiert/potenziell instabil
# einstufte. Ein gezielter Retest desselben 4-GPU-Pools mit FA=ON (2 Läufe,
# qwen3.6:35b Hybrid-MoE, 41/42 Layer, keine Fehler) verlief sauber — die
# ursprüngliche Multi-GPU-FA-Instabilität war vermutlich derselbe transiente
# Treiberzustand-Effekt wie der in Phase 6 korrigierte Befund, kein
# eigenständiges Architekturproblem. Host läuft seither wieder als EIN
# gepoolter 4-GPU-Container mit FA=ON (Nutzervorgabe 2026-09-16).
# Falls künftig erneut Instabilität auftritt: auf cuda12-maxwell-latest
# (FA=OFF) zurückrollen, siehe Log für den Rollback-Befund.

services:
  ollama:
    image: ghcr.io/h3rb3rn/ollama-legacy:cuda12-maxwell-singlegpu-fa-latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /opt/ollama/models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_CONTEXT_LENGTH=65536
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_LOAD_TIMEOUT=10m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_SCHED_SPREAD=true
      - OLLAMA_KV_CACHE_TYPE=f16
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_MULTIUSER_CACHE=false
      - OLLAMA_GPU_OVERHEAD=268435456
      - OLLAMA_METRICS=true
      # PTX-JIT kernels are cached — no cold-start delay after the first run
      - CUDA_CACHE_PATH=/root/.ollama/cuda-cache
      - LLAMA_ARG_THREADS=4
      - LLAMA_ARG_THREADS_BATCH=4
      # Nur bei tatsächlich Vision-fähigen Modellen wirksam (Fix aus Finding 1,
      # BUG-hybrid-arch-degeneration.md) — bei reinen Textmodellen wirkungslos.
      - LLAMA_ARG_MMPROJ_OFFLOAD=false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
