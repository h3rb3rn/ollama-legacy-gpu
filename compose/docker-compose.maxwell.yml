# Local, hardware-qualified Ollama0.35.0 CUDA12 Maxwell deployment example.
# N11's installed production snapshot also preserves host-specific contexts.
# This image ID must already exist locally; import/build a qualified image first.
# Tesla default: Q4 KV + Flash Attention. K80/CUDA11 requires F16/FAOFF.
# Usage: docker compose -f compose/docker-compose.maxwell.yml up -d

services:
  ollama:
    image: sha256:b32e6885fd96fc827611d315424cfd44eaa73d259d141df4517beaf0e54b2c63
    pull_policy: never
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /opt/ollama/models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_CONTEXT_LENGTH=65536
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_LOAD_TIMEOUT=10m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_SCHED_SPREAD=true
      - OLLAMA_KV_CACHE_TYPE=q4_0
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_MULTIUSER_CACHE=false
      - OLLAMA_GPU_OVERHEAD=268435456
      - OLLAMA_METRICS=true
      # PTX-JIT kernels are cached — no cold-start delay after the first run
      - CUDA_CACHE_PATH=/root/.ollama/cuda-cache
      - LLAMA_ARG_THREADS=4
      - LLAMA_ARG_THREADS_BATCH=4
      # Nur bei tatsächlich Vision-fähigen Modellen wirksam (Fix aus Finding 1,
      # BUG-hybrid-arch-degeneration.md) — bei reinen Textmodellen wirkungslos.
      - LLAMA_ARG_MMPROJ_OFFLOAD=false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
