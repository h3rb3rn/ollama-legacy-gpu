# Deployment for Tesla M10 (CC 5.0, Maxwell) — CUDA 12, Single-GPU-Instanzen
# Usage: docker compose -f compose/docker-compose.maxwell.yml up -d
#
# Topologie-Historie: Bis 2026-09-15 lief hier EIN Container mit allen 4 GPUs
# gepoolt (KV=q4_0, FA=OFF). Die Optimierungskampagne (siehe
# PERFORMANCE-OPTIMIZATION-LOG.md) hat auf 4 unabhängige Single-GPU-Instanzen
# umgestellt — das erlaubt pro Instanz Flash Attention (Phase 2, nur für
# Single-GPU validiert, siehe Log) und vermeidet die in Phase 6 untersuchte
# potenzielle Instabilität knapper Multi-GPU-Pools bei großen Modellen.
# Image-Tag cuda12-maxwell-singlegpu-fa-latest: NICHT für Multi-GPU-Pools
# verwenden (siehe .github/workflows/build.yml Kommentar + Phase 2 im Log).
# Die GPU-UUIDs unten sind spezifisch für N11-M10 — auf einem anderen Host
# mit `nvidia-smi --query-gpu=index,uuid --format=csv` neu ermitteln.

x-tesla-single: &tesla-single
  image: ghcr.io/h3rb3rn/ollama-legacy:cuda12-maxwell-singlegpu-fa-latest
  pull_policy: always
  volumes:
    - /opt/ollama/models:/root/.ollama
  environment:
    - OLLAMA_HOST=0.0.0.0
    - OLLAMA_CONTEXT_LENGTH=65536
    - OLLAMA_KEEP_ALIVE=30m
    - OLLAMA_LOAD_TIMEOUT=10m
    - OLLAMA_MAX_LOADED_MODELS=1
    - OLLAMA_NUM_PARALLEL=1
    - OLLAMA_SCHED_SPREAD=false
    - OLLAMA_KV_CACHE_TYPE=f16
    - OLLAMA_FLASH_ATTENTION=1
    - OLLAMA_MULTIUSER_CACHE=false
    - OLLAMA_GPU_OVERHEAD=268435456
    - OLLAMA_METRICS=true
    - CUDA_CACHE_PATH=/root/.ollama/cuda-cache
    - LLAMA_ARG_THREADS=4
    - LLAMA_ARG_THREADS_BATCH=4
    # Nur bei tatsächlich Vision-fähigen Modellen wirksam (Fix aus Finding 1,
    # BUG-hybrid-arch-degeneration.md) — bei reinen Textmodellen wirkungslos.
    - LLAMA_ARG_MMPROJ_OFFLOAD=false
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
    interval: 30s
    timeout: 15s
    retries: 5
    start_period: 90s

services:
  ollama-tesla-1:
    <<: *tesla-single
    container_name: ollama-tesla-1
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - GPU-d8c208aa-6a45-b343-0524-144698b136b5
              capabilities: [gpu]

  ollama-tesla-2:
    <<: *tesla-single
    container_name: ollama-tesla-2
    ports:
      - "11435:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - GPU-90957fad-3ba7-bde9-19ce-b943e7ac0be9
              capabilities: [gpu]

  ollama-tesla-3:
    <<: *tesla-single
    container_name: ollama-tesla-3
    ports:
      - "11436:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - GPU-5d2c7138-980f-c6b3-aeaf-3c005624128f
              capabilities: [gpu]

  ollama-tesla-4:
    <<: *tesla-single
    container_name: ollama-tesla-4
    ports:
      - "11437:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - GPU-359822ee-c492-e9f4-26f4-3b41cec05c37
              capabilities: [gpu]
