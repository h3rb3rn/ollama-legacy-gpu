# Test-Deployment fuer BUG-hybrid-arch-degeneration.md
# Multi-GPU-Pool auf N11-M10: alle 4x Tesla M10 (32 GiB kombiniert)
# Repro-Bedingungen: FA=0, KV-Cache f16 (wie im Bug-Report)
# Modelle: qwen3.6:35b (hybrid SSM/Attention MoE, Vision) vs. olmo32b (dense, Kontrolle)

services:
  ollama:
    image: ghcr.io/h3rb3rn/ollama-legacy:cuda12-maxwell-latest
    container_name: ollama-multigpu-test
    ports:
      - "11434:11434"
    volumes:
      - /opt/ollama/models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_CONTEXT_LENGTH=${TEST_CONTEXT_LENGTH:-65536}
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_LOAD_TIMEOUT=15m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_SCHED_SPREAD=true
      - OLLAMA_KV_CACHE_TYPE=f16
      - OLLAMA_FLASH_ATTENTION=0
      - OLLAMA_MULTIUSER_CACHE=false
      - OLLAMA_GPU_OVERHEAD=268435456
      - OLLAMA_METRICS=true
      - CUDA_CACHE_PATH=/root/.ollama/cuda-cache
      - LLAMA_ARG_THREADS=4
      - LLAMA_ARG_THREADS_BATCH=4
      # row split-mode fails hard on MoE models on Maxwell ("device CUDA0 does
      # not support split buffers" — confirmed with qwen3.6:35b this session,
      # matches the documented llama4:scout caveat in patch-ollama-dynamic-pool.py).
      # layer is the only working choice for N11-M10's MoE workloads.
      - OLLAMA_SPLIT_MODE=${TEST_SPLIT_MODE:-layer}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
