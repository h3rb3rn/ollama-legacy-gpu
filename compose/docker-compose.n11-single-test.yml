# Test-Deployment fuer BUG-hybrid-arch-degeneration.md
# 4x Single-GPU-Instanzen auf N11-M10 (je 1 Tesla M10, 8 GiB)
# Repro-Bedingungen aus dem Bug-Report: FA=0, KV-Cache f16
# OLLAMA_CONTEXT_LENGTH wird empirisch auf das VRAM-Maximum gesetzt (siehe Debug-Notizen unten)

services:
  ollama-tesla-1:
    image: ghcr.io/h3rb3rn/ollama-legacy:cuda12-maxwell-latest
    container_name: ollama-tesla-1
    ports:
      - "11434:11434"
    volumes:
      - /opt/ollama/models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_CONTEXT_LENGTH=${TEST_CONTEXT_LENGTH:-65536}
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_LOAD_TIMEOUT=10m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_SCHED_SPREAD=false
      - OLLAMA_KV_CACHE_TYPE=f16
      - OLLAMA_FLASH_ATTENTION=0
      - OLLAMA_MULTIUSER_CACHE=false
      - OLLAMA_GPU_OVERHEAD=268435456
      - OLLAMA_METRICS=true
      - CUDA_CACHE_PATH=/root/.ollama/cuda-cache
      - LLAMA_ARG_THREADS=4
      - LLAMA_ARG_THREADS_BATCH=4
      # Vision-capable models (Qwen3.5/3.6 etc.) starve GPU layer offload on a
      # single 8 GiB M10 otherwise: mtmd's own worst-case mmproj memory
      # estimate (~5.4 GiB) leaves too little headroom for even one decoder
      # layer. Keeping the vision tower on CPU instead frees the GPU almost
      # entirely for the text model. Confirmed on N11-M10: 0/34 -> 34/34
      # layers offloaded, correct output, ~5.7 tok/s. Irrelevant for
      # text-only models (SmolLM3 etc.) and safe to leave on for the 4-GPU
      # pool, which already has enough combined VRAM (Finding 3).
      - LLAMA_ARG_MMPROJ_OFFLOAD=false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["GPU-d8c208aa-6a45-b343-0524-144698b136b5"]
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

